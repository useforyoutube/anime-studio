name: Shadow Hunter - redraw missing reference pictures
on: workflow_dispatch
permissions:
  contents: write
jobs:
  refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: "hf-kit-v1"}
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q cryptography numpy pillow diffusers transformers accelerate peft safetensors opencv-python-headless
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: python studio/shadow/kit.py refs 0 1 kitsrc
        env: {GH_TOKEN: "${{ github.token }}"}

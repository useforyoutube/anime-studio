name: Kaggle moving clips (free GPU)
on:
  workflow_dispatch:
    inputs:
      tag: {default: "concept"}
      clips: {default: ""}
      style: {default: ""}
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography requests
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: python studio/kaggle_clips.py "${{ inputs.tag }}"
        env: {KAGGLE_TOKEN: "${{ secrets.KAGGLE_TOKEN }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", CLIPS_JSON: "${{ inputs.clips }}", CLIP_STYLE: "${{ inputs.style }}"}
permissions:
  contents: write

name: AI paint test
on:
  workflow_dispatch:
    inputs:
      model: {default: "stablediffusionapi/anything-v5"}
      strength: {default: "0.6"}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-noto-core libraqm0 > /dev/null 2>&1 || true
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q cryptography numpy pillow diffusers transformers accelerate peft safetensors
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: mkdir -p out && python studio/ai_paint_test.py out/preview.png
        env: {MODEL: "${{ inputs.model }}", STRENGTH: "${{ inputs.strength }}"}
      - uses: actions/upload-artifact@v4
        with: {name: preview, path: out, retention-days: 1}

name: RIFE probe (step 4 inbetweens)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q onnxruntime numpy huggingface_hub
      - name: inputs, outputs, speed
        run: |
          python - <<'PY'
          import time, numpy as np, onnxruntime as ort
          from huggingface_hub import hf_hub_download
          for f in ("rife49_ensemble_True_scale_1_sim.onnx", "rife47_ensemble_True_scale_1_sim.onnx"):
              p = hf_hub_download("yuvraj108c/rife-onnx", f)
              s = ort.InferenceSession(p, providers=["CPUExecutionProvider"])
              print(f, [(i.name, i.shape, i.type) for i in s.get_inputs()], [(o.name, o.shape) for o in s.get_outputs()])
              ins = s.get_inputs()
              H, W = 1216, 832
              feed = {}
              for i in ins:
                  shp = [d if isinstance(d, int) else {0: 1}.get(k, None) for k, d in enumerate(i.shape)]
                  print(" shape", i.name, shp)
              try:
                  a = np.random.rand(1, 3, H, W).astype(np.float32)
                  if len(ins) == 3:
                      feed = {ins[0].name: a, ins[1].name: a, ins[2].name: np.full((1, 1, H, W), 0.5, np.float32)}
                  elif len(ins) == 2:
                      feed = {ins[0].name: a, ins[1].name: a}
                  else:
                      feed = {ins[0].name: np.concatenate([a, a], 1)}
                  t = time.time(); o = s.run(None, feed); print(" ok", [x.shape for x in o], round(time.time() - t, 1), "s")
              except Exception as e:
                  print(" run failed", str(e)[:400])
          PY

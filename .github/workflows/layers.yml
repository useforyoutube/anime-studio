name: Layers (backgrounds + green-screen characters)
on:
  workflow_dispatch:
    inputs:
      tag: {default: "lay1"}
      part: {default: "bg"}
      machines: {default: "[0,1,2,3,4,5,6]"}
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        m: ${{ fromJSON(inputs.machines) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: "hf-layers-${{ inputs.part }}-v1"}
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q cryptography numpy pillow diffusers transformers accelerate peft safetensors
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: python studio/layers.py ${{ matrix.m }} ${{ strategy.job-total }} out
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", PART: "${{ inputs.part }}"}

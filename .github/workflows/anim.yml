name: Anime motion round (Kaggle GPU + GitHub)
on:
  workflow_dispatch:
    inputs:
      tag: {default: "am1"}
      sat: {default: "1.25"}
      gamma: {default: "1.3"}
      move: {default: "0.78"}
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q cryptography requests numpy pillow
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: python studio/motion90.py job
        env: {MOVE: "${{ inputs.move }}"}
      - run: python studio/kaggle_anim.py job "${{ inputs.tag }}" frames.zip
        env: {KAGGLE_TOKEN: "${{ secrets.KAGGLE_TOKEN }}", GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/upload-artifact@v4
        with: {name: frames, path: frames.zip, retention-days: 3, compression-level: 0}
  compose:
    needs: draw
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core libraqm0 libfribidi0 > /dev/null
      - run: pip install -q cryptography numpy pillow edge-tts opencv-python-headless imageio-ffmpeg && sudo ln -sf $(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())") /usr/local/bin/ffmpeg
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - uses: actions/download-artifact@v4
        with: {name: frames, path: .}
      - run: mkdir -p fr && cd fr && python -c "import zipfile;zipfile.ZipFile('../frames.zip').extractall('.')" && ls | wc -l
      - run: python studio/anim_comp.py fr "${{ inputs.tag }}.mp4"
        env: {SAT: "${{ inputs.sat }}", GAMMA: "${{ inputs.gamma }}", ISPC: "0", RAIN_N: "60", SPEED_N: "25", HLINE_N: "12", FLASH: "0.45", CLEAN: "2"}
      - run: python studio/score.py "${{ inputs.tag }}.mp4" | tee score.txt
      - name: Publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python - <<'PY'
          import os
          from PIL import Image
          fs = sorted(os.listdir("fr"))
          pick = fs[::max(1, len(fs) // 30)][:30]
          w, h = 384, 216
          s = Image.new("RGB", (6 * w, 5 * h))
          for i, f in enumerate(pick):
              s.paste(Image.open("fr/" + f).convert("RGB").resize((w, h)), ((i % 6) * w, (i // 6) * h))
          s.save("${{ inputs.tag }}-drawings.jpg", quality=86)
          PY
          cp score.txt "${{ inputs.tag }}-score.txt"
          gh release upload samples "${{ inputs.tag }}.mp4" "${{ inputs.tag }}-drawings.jpg" "${{ inputs.tag }}-score.txt" --clobber

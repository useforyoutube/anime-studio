name: Draw v2 (fast queue)
on:
  workflow_dispatch:
    inputs:
      tag: {default: "pv-test"}
      only: {default: ""}
      machines: {default: "[0,1,2]"}
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        m: ${{ fromJSON(inputs.machines) }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q cryptography numpy pillow diffusers transformers accelerate peft safetensors
      - run: python vault/boot.py open
        env: {REPO_KEY: "${{ secrets.REPO_KEY }}"}
      - run: python studio/draw2.py drawings
        timeout-minutes: 50
        env: {GH_TOKEN: "${{ github.token }}", RUN_ID: "${{ github.run_id }}", TAG: "${{ inputs.tag }}", ONLY: "${{ inputs.only }}"}
